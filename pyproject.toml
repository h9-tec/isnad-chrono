[project]
name = "isnad-chrono"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "httpx>=0.27",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-httpx",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
